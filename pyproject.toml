[project]
name = "manga_dosei"
version = "0.1.0"
description = "ADK workflow for manga dosei daily content generation"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "beautifulsoup4>=4.14.3",
    "google-adk>=1.22.0",
    "google-genai>=1.0.0",
    "greenlet>=3.3.0",
    "openai>=1.60.0",
    "pillow>=12.2.0",
    "pygithub>=2.4.0",
    "python-dotenv>=1.2.1",
]

[project.scripts]
manga_dosei = "manga_dosei.run_daily:main"
manga_dosei-publish = "manga_dosei.publish:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.hatch.build.targets.wheel]
packages = ["manga_dosei"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
